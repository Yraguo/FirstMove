<!doctype html>
<html lang="zh-CN"><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'self'; form-action https://firstmove.invalid">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>连接先行</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fcf9f7;color:#2d2325;font:16px/1.55 system-ui,sans-serif}
main{width:min(90%,400px)}img{border-radius:23%}h1{font-size:28px;margin:20px 0 14px}
label{display:block;margin-top:16px}input,button{font:inherit;width:100%;padding:10px 12px;border-radius:9px;margin-top:8px}
input{border:1px solid #cbbcb8}button{border:0;background:#4b0f1f;color:white;cursor:pointer}#message{color:#8e2640}
</style>
<main><img src="icon.png" width="58" height="58" alt=""><h1>连接先行</h1>
<form action="https://firstmove.invalid/connect" method="get">
<label for="server">工作台地址 · Server URL</label>
<input id="server" name="server" type="url" required autofocus placeholder="https://work.example.com">
<p id="message" role="status"></p><button>连接 · Connect</button></form></main>
<script src="connect.js"></script></html>
